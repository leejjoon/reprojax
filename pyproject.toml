[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reprojax"
version = "0.2.0"
description = "JAX-native, differentiable reprojection of astronomical images (a port of astropy's reproject)"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "jax>=0.10.2",
    "astropy>=7.2.0",
    "mapprojax>=0.3.0,<0.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest", "reproject>=0.21"]

[tool.setuptools.package-data]
reprojax = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
