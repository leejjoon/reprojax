name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  JAX_PLATFORMS: cpu

jobs:
  cpu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11.15'
            constraints: ci/minimum.txt
          - python: '3.14.4'
            constraints: ci/latest.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          freethreaded: false
      - name: Exact CPU environment
        env:
          CONSTRAINTS: ${{ matrix.constraints }}
        run: |
          python -m pip install uv==0.11.8
          uv venv .venv --python "$(command -v python)"
          uv pip install --python .venv/bin/python -c "$CONSTRAINTS" -e '.[test]'
      - name: Full suite
        run: .venv/bin/python -m pytest -q
      - name: Precise f32 path is warning-free
        run: |
          .venv/bin/python -m pytest tests/test_precision_modes.py -q -W error::UserWarning

  packaging:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.4'
          freethreaded: false
      - name: Build from a clean archive
        run: |
          git archive --format=tar.gz --prefix=src/ -o "$RUNNER_TEMP/source.tar.gz" HEAD
          mkdir -p "$RUNNER_TEMP/source"
          tar xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/source"
          python -m pip install uv==0.11.8
          uv venv .venv --python "$(command -v python)"
          uv pip install --python .venv/bin/python build
          mkdir -p "$RUNNER_TEMP/release-dist"
          .venv/bin/python -m build --sdist --wheel --outdir "$RUNNER_TEMP/release-dist" "$RUNNER_TEMP/source/src"
      - name: Assert distribution contents
        run: .venv/bin/python scripts/check_dist_contents.py "$RUNNER_TEMP/release-dist"
      - name: Full suite against the installed wheel
        run: |
          # The suite itself needs the test-only golden reference, which is not
          # a runtime dependency of the wheel. Constrain reproject to the pin.
          uv venv "$RUNNER_TEMP/wheelenv" --python "$(command -v python)"
          uv pip install --python "$RUNNER_TEMP/wheelenv/bin/python" \
            -c ci/latest.txt "$RUNNER_TEMP"/release-dist/*.whl pytest reproject==0.21.0
          env -u PYTHONPATH "$RUNNER_TEMP/wheelenv/bin/python" -m pytest -q tests
      - name: Quick start from the installed sdist
        run: |
          uv venv "$RUNNER_TEMP/sdistenv" --python "$(command -v python)"
          uv pip install --python "$RUNNER_TEMP/sdistenv/bin/python" \
            -c ci/latest.txt "$RUNNER_TEMP"/release-dist/*.tar.gz
          env -u PYTHONPATH "$RUNNER_TEMP/sdistenv/bin/python" scripts/check_quickstart.py
      - name: Write SHA256SUMS
        run: |
          cd "$RUNNER_TEMP/release-dist"
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Upload release-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: ${{ runner.temp }}/release-dist/
          retention-days: 90
          if-no-files-found: error
